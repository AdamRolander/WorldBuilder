name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-tests:
    # The pipeline itself needs a 24 GB+ GPU; CI covers the CPU-only logic
    # (geometry, layout, placement, room textures, exports, parsing) plus lint. GPU validation is
    # a manual step (see CONTRIBUTING.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No local-only files in the tree
        run: test -z "$(git ls-files private third_party outputs)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU deps
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,cpu,robotics]"
      - name: Lint
        run: ruff check main.py src tests scripts webapp/server.py vlm_server/server.py integrations/mujoco
      - name: Tests
        run: pytest
